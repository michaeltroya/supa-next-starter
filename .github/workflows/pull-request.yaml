name: Frontend Pull Request Workflow

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend-pull-request:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - name: Run type check
        run: pnpm type-check

      - name: Check linting
        run: pnpm lint

      - name: Run format check
        run: pnpm format-check

      - name: Run tests
        run: pnpm test:ci

      - name: Build production app
        run: pnpm build

      - name: Audit dependencies
        run: pnpm audit
